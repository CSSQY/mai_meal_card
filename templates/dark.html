<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
{{font_links}}
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; font-family: 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', 'WenQuanYi Micro Hei', sans-serif; }
    #meal-card {
      width: 640px;
      padding: 30px 34px;
      background: linear-gradient(160deg, #0b1220 0%, #151f33 100%);
      border-radius: 18px;
      border: 1px solid #22304a;
      color: #e8eefc;
    }
    .title { font-size: 24px; font-weight: 900; color: #5ea0ff; letter-spacing: 0.5px; }
    .subtitle { margin-top: 6px; font-size: 13px; color: #7f8ca6; }
    .divider { height: 1px; background: #22304a; margin: 18px 0; }
    .items { font-size: 17px; line-height: 2; font-weight: 700; }
    .items span { color: #5ea0ff; }
    .platform-group { margin-top: 14px; padding-left: 12px; border-left: 3px solid #2c4a78; }
    .platform-group:first-child { margin-top: 0; }
    .platform-title {
      margin-bottom: 4px; font-size: 13px; font-weight: 700; color: #7fa8e8;
      letter-spacing: 0.5px; text-transform: none;
    }
    .platform-items { font-size: 17px; line-height: 2; font-weight: 700; }
    .unavailable { margin-top: 16px; font-size: 13px; color: #ff8080; line-height: 1.8; }
    .footer { margin-top: 20px; font-size: 12px; color: #5b6780; }
  </style>
</head>
<body>
  <div id="meal-card">
    <div class="title">🍚 {{title}}</div>
    <div class="subtitle">生成时间：{{date}} · 指标：{{count}} · 平台：{{platforms}}</div>
    <div class="divider"></div>
    <div class="items">{{items_html}}</div>
    <div class="unavailable">{{unavailable}}</div>
    <div class="footer">{{footer}}</div>
  </div>
</body>
</html>
