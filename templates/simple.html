<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="{{font_static}}" />
  <link href="{{font_css}}/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
    #meal-card {
      width: 620px;
      padding: 28px 32px;
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #ececec;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
      color: #1f2328;
    }
    .title { font-size: 24px; font-weight: 900; letter-spacing: 0.5px; }
    .subtitle { margin-top: 6px; font-size: 13px; color: #8a9099; }
    .divider { height: 1px; background: #f0f0f0; margin: 18px 0; }
    .items { font-size: 17px; line-height: 2; font-weight: 700; }
    .items span { color: #4F8CF6; }
    .platform-group { margin-top: 14px; padding-left: 12px; border-left: 3px solid #dbe6fb; }
    .platform-group:first-child { margin-top: 0; }
    .platform-title {
      margin-bottom: 4px; font-size: 13px; font-weight: 700; color: #7f9bd1;
      letter-spacing: 0.5px;
    }
    .platform-items { font-size: 17px; line-height: 2; font-weight: 700; }
    .unavailable { margin-top: 16px; font-size: 13px; color: #d64545; line-height: 1.8; }
    .footer { margin-top: 20px; font-size: 12px; color: #a6abb3; }
  </style>
</head>
<body>
  <div id="meal-card">
    <div class="title">🍚 {{title}}</div>
    <div class="subtitle">生成时间：{{date}} · 指标：{{count}} · 平台：{{platforms}}</div>
    <div class="divider"></div>
    <div class="items">{{items_html}}</div>
    <div class="unavailable">{{unavailable}}</div>
    <div class="footer">{{footer}}</div>
  </div>
</body>
</html>
